<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Header Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 520px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .header svg {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 380px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.5;
      background: #252526;
      color: #ce9178;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 10px;
      resize: vertical;
      outline: none;
      tab-size: 2;
    }

    textarea:focus {
      border-color: #007acc;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      padding: 6px 18px;
      font-size: 13px;
      font-weight: 500;
      background: #0e639c;
      color: #ffffff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1177bb;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      flex: 1;
    }

    #status.success { color: #4ec994; }
    #status.error   { color: #f48771; }
    #status.info    { color: #9cdcfe; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="8" width="112" height="112" rx="16" fill="#1e1e1e"/>
      <!-- JSON Brackets -->
      <text x="32" y="78" font-size="64" fill="#4FC3F7" font-family="monospace">{</text>
      <text x="70" y="78" font-size="64" fill="#4FC3F7" font-family="monospace">}</text>
      <!-- Edit Pen -->
      <rect x="54" y="40" width="20" height="8" transform="rotate(45 64 64)" fill="#ffffff"/>
    </svg>
    <h1>Simple Header Editor</h1>
  </div>
  <p class="subtitle">Edit the JSON array below to configure request header injection per domain.</p>

  <textarea id="config" spellcheck="false" placeholder="Loading…"></textarea>

  <div class="toolbar">
    <button id="save">Save</button>
    <span id="status"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
